<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clicktrail editor</title><link rel="stylesheet" href="style.css"><header><h1>Clicktrail<span>TURN SCREENS INTO SOMETHING PEOPLE CAN TRY</span></h1><nav><button id="demo" class="secondary">Load sample</button><button id="export">Export clickable HTML</button><button id="clear" class="danger">Clear all</button></nav></header><div class="workspace"><aside id="list" aria-label="Steps"></aside><main><div id="empty"><h2>Your next explanation can be clickable.</h2><p>Capture screens from the extension, or load the sample.</p></div><section id="editor" hidden><div class="fields"><label>Step title<input id="title" maxlength="150"></label><label>Instruction<textarea id="note" maxlength="2000"></textarea></label></div><p class="hint">Click the screenshot to place the target. The target advances to the next screen in your exported walkthrough.</p><div class="stage"><img id="screen" alt="Captured screen"><div class="hotspot" id="spot"></div></div><div class="tools"><button class="secondary" id="up">Move earlier</button><button class="secondary" id="down">Move later</button><button class="danger" id="remove">Delete step</button></div></section><p id="status" role="status"></p></main></div><script src="core.js"></script><script src="editor.js"></script></html>
